# CI de la API Sportiva: build de la imagen de desarrollo, lint y tests contra MySQL.
# Usa el mismo compose.yaml y el mismo scripts/setup.sh que los devs: si se rompe el
# entorno local, se rompe la CI.
#
# NO publica imágenes ni artefactos (la publicación en GHCR es un change futuro).

name: CI

on:
  # pull_request (y no pull_request_target): los PRs de forks corren sin secrets ni permisos de escritura.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan corridas viejas de un PR. Cada push a main tiene su CI completa.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Script de setup ejecutable con irm
        # Simula "irm <url> | iex": decodifica los bytes sin descartar un BOM (como irm) y parsea.
        # Un BOM o un caracter no ASCII rompe la instalacion con un comando.
        shell: pwsh
        run: |
          $path = 'scripts/setup-windows.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Output "::error file=$path::Tiene BOM: rompe 'irm | iex'. Guardalo como UTF-8 sin BOM."
            exit 1
          }
          if ($bytes | Where-Object { $_ -gt 127 }) {
            Write-Output "::error file=$path::Tiene caracteres no ASCII: Windows PowerShell 5.1 los lee mal."
            exit 1
          }
          # Caracteres de control (salvo tab, LF y CR): por ejemplo, un backspace que se colo al
          # escapar mal "\b" en una ruta. Parsea bien pero rompe la ruta en silencio.
          if ($bytes | Where-Object { $_ -lt 32 -and $_ -notin 9, 10, 13 }) {
            Write-Output "::error file=$path::Tiene caracteres de control invisibles (revisa las rutas con barras invertidas)."
            exit 1
          }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput([Text.Encoding]::UTF8.GetString($bytes), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output "::error file=$path,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Output "OK: $path se parsea sin errores tal como lo recibe irm."

      - name: Setup (build, MySQL, composer install, APP_KEY, migraciones)
        run: bash scripts/setup.sh

      - name: Lint (Pint)
        run: docker compose exec -T backend vendor/bin/pint --test

      - name: Tests
        run: docker compose exec -T backend php artisan test

      - name: Contrato OpenAPI al día
        # Regenera docs/api/openapi.json desde el código y falla si difiere del commiteado.
        # No publica nada: el contrato versionado es el que consume el frontend.
        run: |
          docker compose exec -T backend php artisan scramble:export
          if ! git diff --exit-code -- docs/api/openapi.json; then
            echo "::error file=docs/api/openapi.json::El contrato OpenAPI está desactualizado. Regeneralo con: docker compose exec backend php artisan scramble:export (y commiteá docs/api/openapi.json)"
            exit 1
          fi

      - name: Logs de los servicios
        if: failure()
        # El entrypoint de MySQL imprime la contraseña de root aleatoria: se filtra de los logs.
        run: |
          docker compose logs --no-color | grep -v 'GENERATED ROOT PASSWORD' || true
          docker compose exec -T backend sh -c 'tail -n 200 storage/logs/laravel.log 2>/dev/null' || true

      - name: Bajar servicios
        if: always()
        # Sin -v: el runner se descarta igual al terminar el job.
        run: docker compose down
